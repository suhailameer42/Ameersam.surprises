<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Surprise QR</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .card {
      width: min(520px, 92vw);
      padding: 28px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      text-align: center;
      backdrop-filter: blur(14px);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 1.7rem;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0 0 22px;
      color: #d9d9d9;
      line-height: 1.6;
    }
    .qr {
      width: 280px;
      height: 280px;
      border-radius: 18px;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .link-box {
      word-break: break-all;
      margin: 0 auto 18px;
      width: fit-content;
      max-width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 12px 14px;
      border-radius: 14px;
      color: #f6f6f6;
      font-size: 0.95rem;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      color: #111;
      background: #ff6ea8;
      cursor: pointer;
      font-weight: 700;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 18px rgba(255,110,168,0.28); }
    .copied {
      margin-top: 14px;
      color: #a0ffb6;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Send the Surprise QR</h1>
    <p>Share this QR code with the person who should open the surprise. Scanning it will take them directly to the hidden page.</p>
    <div class="qr">
      <img id="qrImage" src="" alt="Surprise QR code" loading="lazy" width="260" height="260" />
    </div>
    <div class="link-box" id="shareUrl"></div>
    <button id="copyButton">Copy surprise link</button>
    <div class="copied" id="copyStatus" aria-live="polite"></div>
  </div>

  <script>
    const shareUrl = "https://suhailameer42.github.io/Ameersam.surprises/sam.html";
    const encoded = encodeURIComponent(shareUrl.replace(/#/g, "%23"));
    const qrImage = document.getElementById("qrImage");
    const shareUrlEl = document.getElementById("shareUrl");
    const copyButton = document.getElementById("copyButton");
    const copyStatus = document.getElementById("copyStatus");

    qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encoded}`;
    shareUrlEl.textContent = shareUrl;

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(shareUrl);
        copyStatus.textContent = "Link copied to clipboard.";
      } catch (err) {
        copyStatus.textContent = "Copy failed; please copy it manually.";
      }
      setTimeout(() => { copyStatus.textContent = ""; }, 2200);
    });
  </script>
</body>
</html>
